name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # audiopus_sys 0.2.2 bundles libopus, whose CMakeLists.txt declares
  # cmake_minimum_required(VERSION < 3.5) — the CMake 4.x now shipping on the
  # Windows runners rejects that outright. The Linux/macOS jobs dodge the
  # bundled build (system deps via pkg-config / Homebrew opus), but Windows has
  # no system libopus and builds the bundled copy. Setting this env var
  # (CMake 4.0.3+) tells CMake to configure legacy projects anyway. Harmless on
  # platforms that don't invoke CMake. Mirrors release.yml (PR #39).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  macos-core:
    name: patched Core (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja qt openssl@3 googletest
      - name: Build native Core and run teardown regressions
        env:
          SYNBAD_CORE_TESTS: "ON"
        run: bash dist/macos/build-core.sh core-test '${{ matrix.arch }}'
      - name: Verify stable signing of native helpers and app
        run: |
          app="core-sign-test/Synbad.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp core-test/deskflow-client core-test/deskflow-server "$app/Contents/MacOS/"
          # Reuse native Mach-O fixtures to test all four signing identities.
          cp core-test/deskflow-client "$app/Contents/MacOS/synbad-gui"
          cp core-test/deskflow-server "$app/Contents/MacOS/synbadd"
          sed 's/@VERSION@/0.0.0/g' dist/macos/Info.plist > "$app/Contents/Info.plist"
          bash dist/macos/sign.sh "$app"

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev
      - name: Install macOS audio deps
        # audiopus_sys's bundled libopus cmake build fails on
        # aarch64-apple-darwin. Installing opus via brew lets pkg-config
        # find it, skipping the bundled build entirely.
        if: runner.os == 'macOS'
        run: brew install --quiet opus pkg-config
      - name: clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (GUI with tray)
        if: runner.os == 'Linux'
        run: cargo clippy -p synbad-gui --features tray --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev
      - name: Install macOS audio deps
        if: runner.os == 'macOS'
        run: brew install --quiet opus pkg-config
      - name: cargo test
        run: cargo test --workspace --all-targets --no-fail-fast
      - name: cargo build (synbadd, 7z feature on Windows)
        if: runner.os == 'Windows'
        run: cargo build -p synbadd --features sevenz

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev
      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
